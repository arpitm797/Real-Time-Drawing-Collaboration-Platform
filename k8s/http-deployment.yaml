apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whiteboard-http
  template:
    metadata:
      labels:
        app: whiteboard-http
    spec:
      containers:
        - name: http-backend
          image: whiteboard-http:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: whiteboard-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-secrets
                  key: JWT_SECRET